<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verb Trainer</title>
    <link rel="icon" type="image/x-icon" href="./japanese-gate.png">
    <style>
        button.btn {
            margin: 5px;
            padding: 5px;
            width: 30%;
            background-color: lightseagreen;
            font-size: larger;
        }

        button.btn-line {
            margin: 5px;
            padding: 5px;
            padding-inline: 10px;
            background-color: lightgreen;
            font-size: larger;
        }

        .hidden {
            /*display: none;*/
            visibility: hidden;
        }

        #container-base {
            font-size: xx-large;
        }

        #verbs-table {
            width: 90%;
        }

        #verbs-table,
        #verbs-table th,
        #verbs-table td {
            text-align: left;
            font-family: arial, sans-serif;
            border: 1px solid black;
            padding: 4px;
        }

        .table-header {
            background-color: bisque !important;
        }

        .table-label {
            width: 50%;
        }

        .table-value {
            width: 50%;
        }
    </style>
</head>

<body>

    <h1 style="font-size: xxx-large;">Verb Trainer</h1>

    <div id="container-base">
        <!-- Radio Group -->
        <label>
            <input type="radio" name="mode" value="english" checked>
            From English
        </label>
        <label>
            <input type="radio" name="mode" value="japanese-base">
            From Japanese (Base form)
        </label>
        <label>
            <input type="radio" name="mode" value="japanese-te">
            From Japanese (TE-form)
        </label>

        <hr>

        <table class="table" id="verbs-table">
            <tr class="table-header">
                <td class="table-label">Tense</td>
                <td class="table-value">Verb</td>
                <td class=""></td>
            </tr>
            <tr>
                <td>English</td>
                <td id="english"></td>
                <td>
                    <button class="btn-line" onclick="show_line('english')">Show</button>
                </td>
            </tr>
            <tr>
                <td>JP Present Aff. Inf.</td>
                <td id="jp-present-aff-informal"></td>
                <td>
                    <button class="btn-line" onclick="show_line('jp-present-aff-informal')">Show</button>
                </td>
            </tr>
            <tr>
                <td>JP Present Aff. Form.</td>
                <td id="jp-present-aff-formal"></td>
                <td>
                    <button class="btn-line" onclick="show_line('jp-present-aff-formal')">Show</button>
                </td>
            </tr>
            <tr>
                <td>JP TE-form</td>
                <td id="jp-te-form"></td>
                <td>
                    <button class="btn-line" onclick="show_line('jp-te-form')">Show</button>
                </td>
            </tr>
        </table>

        <hr>
        <button id="loadBtn" class="btn">Load verb</button>
        <button id="showBtn" class="btn">Show</button>
    </div>
    <!-- Buttons -->


    <script src="script.js"></script>

</body>

</html>
