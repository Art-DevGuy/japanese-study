<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verb Trainer</title>
  <style>

    button {
        margin: 5px;
        padding: 5px;
        width: 100px;
        background-color: lightseagreen;
    }

    .hidden {
      display: none;
    }

    #verbs-table,
    #verbs-table th,
    #verbs-table td
    {
        text-align: left;
        font-family: arial, sans-serif;
        border:1px solid black;
        padding: 4px;
    }

    .table-header
    {
        background-color: bisque !important;
    }

    .table-label
    {
        width: 180px;
    }

    .table-value
    {
        min-width: 180px;
    }



  </style>
</head>
<body>

  <h2>Verb Trainer</h2>

  <!-- Radio Group -->
  <label>
    <input type="radio" name="mode" value="english" checked>
    From English
  </label>
  <label>
    <input type="radio" name="mode" value="japanese">
    From Japanese
  </label>

  <hr>

  <table class="table" id="verbs-table">
    <tr class="table-header">
        <td class="table-label">Tense</td>
        <td class="table-value">Verb</td>
    </tr>
    <tr>
        <td>English</td>
        <td id="english"></td>
    </tr>
    <tr>
        <td>JP Present Aff. Inf.</td>
        <td id="jp-present-aff-informal"></td>
    </tr>
    <tr>
        <td>JP Present Aff. Form.</td>
        <td id="jp-present-aff-formal"></td>
    </tr>
    <tr>
        <td>JP TE-form</td>
        <td id="jp-te-form"></td>
    </tr>
  </table>
  
  <hr>

  <!-- Buttons -->
  <button id="loadBtn">Load verb</button>
  <button id="showBtn">Show</button>

  <script src="script.js"></script>

</body>
</html>
